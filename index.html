    // HÀM ĐẢO NGẪU NHIÊN THỨ TỰ CÂU HỎI
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
    
    // Gọi hàm đảo mảng câu hỏi trước khi hiển thị
    shuffleArray(questions);

    const container = document.getElementById("quiz-container");
    
    // Khởi tạo HTML cho 53 câu hỏi sau khi đã xáo trộn
    // LƯU Ý: Chữ "Câu..." mặc định đã được gỡ bỏ khỏi đề, hệ thống sẽ tự đánh số từ 1 đến 53
    questions.forEach((item, index) => {
        let html = `<div class="question" id="q${index}">
                        <div class="question-title">Câu ${index + 1}: ${item.q}</div>
                        <div class="options">`;
        for (let key in item.options) {
            html += `<label class="option-label" id="label-q${index}-${key}">
                        <input type="radio" name="q${index}" value="${key}"> 
                        ${key}. ${item.options[key]}
                     </label>`;
        }
        html += `</div></div>`;
        container.innerHTML += html;
    });

    function submitQuiz() {
        // 1. Kiểm tra thông tin học sinh
        const studentName = document.getElementById("studentName").value.trim();
        const studentClass = document.getElementById("studentClass").value.trim();
        const schoolName = document.getElementById("schoolName").value.trim();

        if (!studentName || !studentClass || !schoolName) {
            alert("Vui lòng điền đầy đủ Họ tên, Lớp và Tên trường trước khi nộp bài!");
            document.getElementById("studentName").focus();
            return;
        }

        // 2. Chấm điểm
        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            
            for (let key in item.options) {
                document.getElementById(`label-q${index}-${key}`).className = "option-label";
            }

            const correctLabel = document.getElementById(`label-q${index}-${item.answer}`);
            correctLabel.classList.add("correct-text");

            if (selected) {
                if (selected.value === item.answer) {
                    score++;
                } else {
                    const wrongLabel = document.getElementById(`label-q${index}-${selected.value}`);
                    wrongLabel.classList.add("wrong-text");
                }
            }
        });

        // 3. Gửi dữ liệu lên Google Sheets
        const examRecord = {
            hoTen: studentName,
            lop: studentClass,
            truong: schoolName,
            diem: score + " / " + questions.length
        };
        
        // Link API của bạn
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzqk5KJzF6Dq4wzmt3Xf2-WUTkoLOwva7-UW6Io6dO4yIKQxfPmMKNrNSqgUfMFhDZX/exec';

       // 3. Gửi dữ liệu lên Google Sheets
//        const scriptURL = 'DÁN_LINK_WEB_APP_MỚI_CỦA_BẠN_VÀO_ĐÂY';

        // Tạo dữ liệu dạng Form chuẩn của trình duyệt
        const formData = new FormData();
        formData.append("hoTen", studentName);
        formData.append("lop", studentClass);
        formData.append("truong", schoolName);
        formData.append("diem", score + " / " + questions.length);

        const btnSubmit = document.querySelector('.btn-submit');
        btnSubmit.innerText = "Đang nộp bài... Vui lòng đợi!";
        btnSubmit.disabled = true;

        // Bắn dữ liệu về Sheets
        fetch(scriptURL, {
            method: 'POST',
            body: formData,
            mode: 'no-cors' 
        })
        .then(response => {
            // 4. Hiển thị kết quả cho học sinh
            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <h3>KẾT QUẢ BÀI THI</h3>
                <p><strong>Họ và tên:</strong> ${studentName}</p>
                <p><strong>Lớp:</strong> ${studentClass} &nbsp;|&nbsp; <strong>Trường:</strong> ${schoolName}</p>
                <p style="font-size: 1.5em; font-weight: bold; margin-top: 15px;">
                    Số câu đúng: ${score} / ${questions.length}
                </p>
                <p style="font-size: 0.9em; color: #27ae60; margin-top: 10px;">✅ Điểm đã được gửi về hệ thống của giáo viên!</p>
            `;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            btnSubmit.innerText = "Đã nộp bài";
        })
        .catch(error => {
            alert('Có lỗi xảy ra khi nộp bài. Em hãy kiểm tra mạng và thử lại!');
            btnSubmit.innerText = "Nộp bài & Xem kết quả";
            btnSubmit.disabled = false;
        });
    }
</script>
